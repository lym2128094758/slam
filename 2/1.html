<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLAM 激光测量坐标转换交互演示</title>
<style>
body{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;max-width:900px;margin:24px auto;padding:0 16px;color:#1f2937}
main{border:1px solid #d8dee8;border-radius:18px;padding:20px}
h1{font-size:1.5rem} .controls{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;margin:16px 0}
input{width:100%;accent-color:#3979d8} .result{background:#f1f5f9;padding:14px;border-radius:12px;font-size:1.2rem;font-weight:700}
svg{width:100%;height:auto;background:#fff;border-radius:12px}
small{color:#64748b}
</style>
</head>
<body>
<main>
<h1>交互演示：激光测量怎样变成坐标？</h1>
<p>蓝点代表机器人，橙点代表激光测到的观测点。拖动角度和距离滑块，观察坐标如何变化。</p>
<svg id="plot" viewBox="0 0 700 440" role="img" aria-label="机器人与激光观测点坐标示意图"></svg>
<div class="controls"><label for="angle">测量角度</label><strong><span id="angleVal">45</span>°</strong><input id="angle" type="range" min="0" max="90" step="5" value="45" style="grid-column:1/3"><label for="dist">测量距离</label><strong><span id="distVal">3.0</span> 米</strong><input id="dist" type="range" min="0.5" max="4" step="0.5" value="3" style="grid-column:1/3"></div>
<div class="result">坐标结果：(<span id="xVal">2.12</span>, <span id="yVal">2.12</span>) 米</div>
<p><small>简化假设：以机器人为坐标原点，激光雷达坐标轴与机器人坐标轴对齐。真实系统还要考虑传感器安装偏移与机器人位姿。</small></p>
</main>
<script>
const angle=document.getElementById('angle'), dist=document.getElementById('dist'), plot=document.getElementById('plot');
function render(){
 const a=Number(angle.value), r=Number(dist.value), rad=a*Math.PI/180;
 const x=r*Math.cos(rad), y=r*Math.sin(rad);
 document.getElementById('angleVal').textContent=a;
 document.getElementById('distVal').textContent=r.toFixed(1);
 document.getElementById('xVal').textContent=x.toFixed(2);
 document.getElementById('yVal').textContent=y.toFixed(2);
 const ox=95, oy=355, scale=95, px=ox+x*scale, py=oy-y*scale;
 let s='';
 for(let gx=50;gx<=650;gx+=50)s+=`<line x1="${gx}" y1="25" x2="${gx}" y2="390" stroke="#cbd5e1" stroke-width="1"/>`;
 for(let gy=40;gy<=390;gy+=50)s+=`<line x1="40" y1="${gy}" x2="660" y2="${gy}" stroke="#cbd5e1" stroke-width="1"/>`;
 s+=`<line x1="40" y1="${oy}" x2="660" y2="${oy}" stroke="#64748b" stroke-width="2"/><line x1="${ox}" y1="400" x2="${ox}" y2="25" stroke="#64748b" stroke-width="2"/>`;
 s+=`<text x="650" y="${oy-12}" font-size="18" fill="#334155">X</text><text x="${ox+12}" y="35" font-size="18" fill="#334155">Y</text>`;
 s+=`<line x1="${ox}" y1="${oy}" x2="${px}" y2="${py}" stroke="#d99435" stroke-width="5" stroke-dasharray="12 8" stroke-linecap="round"/>`;
 s+=`<circle cx="${ox}" cy="${oy}" r="12" fill="#3979d8" stroke="white" stroke-width="3"/><circle cx="${px}" cy="${py}" r="11" fill="#d99435" stroke="white" stroke-width="3"/>`;
 s+=`<text x="${ox-28}" y="${oy+34}" font-size="17" fill="#1f2937">机器人</text><text x="${Math.min(px+14,560)}" y="${Math.max(py-16,45)}" font-size="17" fill="#b7791f">观测点</text>`;
 plot.innerHTML=s;
}
angle.addEventListener('input',render);dist.addEventListener('input',render);render();
</script>
</body></html>
